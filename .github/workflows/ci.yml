name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # コミットされた gradle-wrapper.jar が、Gradle 公式のものか検証する
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      # DB が必要なテストは RUN_DB_TESTS が未設定のためスキップされる
      - run: ./gradlew build

  integration-test:
    name: 結合テスト (Writer / Reader / アプリ)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # compose のネットワーク内で、コネクションプールや読み書きの振り分けを確認する
      - name: テスト実行
        run: docker compose --profile test run --rm --build app-test
      # Writer を停止して reader1 を昇格するため、DB が壊れる。他のテストのあと、後片付けの前に実行する
      - name: フェイルオーバーのテスト
        run: docker compose --profile failover-test run --rm --build app-failover-test
      - name: 失敗時のログ
        if: failure()
        run: docker compose logs --no-color
      - name: 後片付け
        if: always()
        run: docker compose --profile test --profile failover-test down -v
