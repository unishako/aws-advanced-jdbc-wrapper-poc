# ============================================================
# 凡例 (各設定の上にラベルを付けています)
#   [必須] 消す・変えると動かなくなる、または機能が変わる。基本的に触らない
#   [環境] 環境(開発 / 本番)ごとに変える値
#   [調整] 動作を調整するための値。変えても動くが、挙動(本数・時間など)が変わる
#   [変数] 下の ② の spring.datasource.url に、${...} として差し込むための値。
#          poc.* という名前は独自のもので、Spring や wrapper が決めたものではない(自由に変えられる)。
#          名前を変える・消すときは、② の URL 側の ${...} も合わせて直す
# ============================================================

# ============================================================
# ① アプリの基本
# ============================================================
# [調整]
spring.application.name=aws-advanced-jdbc-wrapper-poc
server.port=8080
logging.level.com.example.poc=INFO

# ============================================================
# ② DB への接続 (AWS Advanced JDBC Wrapper)
# ============================================================
# [必須] wrapper のドライバーを使う、プールなしの DataSource。
#        コネクションプールは Spring ではなく、wrapper の内部プールが担当する
spring.datasource.type=org.springframework.jdbc.datasource.DriverManagerDataSource
spring.datasource.driver-class-name=software.amazon.jdbc.Driver

# [必須] 接続先の URL。? より後ろが wrapper のオプションで、${...} は下の ③④ の変数
# [環境] ホスト名部分(Aurora のクラスターエンドポイント)。ここでは compose ネットワーク内の alias
# 読みやすいように、行末の \ で改行している(次の行の先頭の空白は無視される)。
# 注意: 続きの行の間にはコメントを書けない。\ の後ろに空白を入れてはいけない(改行として扱われなくなる)
spring.datasource.url=jdbc:aws-wrapper:postgresql://poc.cluster-abcdefghijkl.ap-northeast-1.rds.amazonaws.com:5432/${POSTGRES_DB:app}\
  ?wrapperPlugins=${poc.wrapper.plugins}\
  &wrapperDialect=${poc.wrapper.dialect}\
  &clusterId=${poc.wrapper.cluster-id}\
  &readerHostSelectorStrategy=${poc.wrapper.reader-host-selector-strategy}\
  &endpointSubstitutionRole=${poc.wrapper.initial-connection.endpoint-substitution-role}\
  &verifyOpenedConnectionType=${poc.wrapper.initial-connection.verify-opened-connection-type}\
  &openConnectionRetryTimeoutMs=${poc.wrapper.initial-connection.open-connection-retry-timeout-ms}\
  &failoverMode=${poc.wrapper.failover.mode}\
  &failoverTimeoutMs=${poc.wrapper.failover.timeout-ms}\
  &clusterTopologyRefreshRateMs=${poc.wrapper.failover.topology-refresh-rate-ms}\
  &connectionPoolType=${poc.pool.type}\
  &cp-MaximumPoolSize=${poc.pool.maximum-size}\
  &cp-MinimumIdle=${poc.pool.minimum-idle}\
  &cp-ConnectionTimeout=${poc.pool.connection-timeout-ms}\
  &cp-AutoCommit=${poc.pool.auto-commit}\
  &cp-TransactionIsolation=${poc.pool.transaction-isolation}\
  &cp-ReadOnly=${poc.pool.read-only}

# [環境] 認証情報 (環境変数で上書きする。既定値はローカル検証用)
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

# [必須] URL が jdbc:aws-wrapper: のため、Doma は方言を自動判定できない。明示する
doma.dialect=postgres

# [必須] テーブル名・カラム名の命名規則。camelCase のプロパティを snake_case のカラムに対応させる (例: createdAt → created_at)
#        全エンティティに適用される。エンティティの @Entity(naming = ...) で個別に指定した場合は、そちらが優先される
doma.naming=SNAKE_LOWER_CASE

# [調整] クエリのタイムアウト(秒)。0 以下だとタイムアウトなし。無期限に待たされないようにする
doma.query-timeout=30

# [調整] 1回に取得する行数のヒント。PostgreSQL ドライバーは、自動コミットが無効のとき(下記の poc.pool.auto-commit=false)に限り、
#        この件数ずつカーソルで取得する。大量の行を返すクエリで、メモリの使用量を抑える
doma.fetch-size=500

# [調整] 結果セットに、同じエンティティへ対応する重複カラムがあったときに、例外にする (既定は何もしない)。マッピングの誤りに早く気づける
doma.throw-exception-if-duplicate-column=true

# 参考: 実行される SQL をログに出す場合は、次を有効にする (通常は出さない)
# logging.level.org.seasar.doma.jdbc.LogKind.SQL=DEBUG

# ============================================================
# ③ wrapper の設定値 (URL に差し込む変数)
# ============================================================
# [変数][必須] プラグインの並び (順番にも意味がある)
#   initialConnection  : クラスターエンドポイントを Writer のインスタンスに置き換える
#                        (クラスターエンドポイントは内部プールの対象外なので、Writer のプールを作るために必要)
#   readWriteSplitting : setReadOnly に応じて Writer / Reader を切り替える (failover2 より前に置く)
#   failover2          : フェイルオーバー時に新しい Writer へ再接続する
#   efm2               : 障害の早期検知
poc.wrapper.plugins=initialConnection,readWriteSplitting,failover2,efm2

# [変数][必須] Aurora PostgreSQL として扱う
poc.wrapper.dialect=aurora-pg

# [変数][必須] initialConnection プラグインの設定 (上記の Writer への置き換えに必要)
poc.wrapper.initial-connection.endpoint-substitution-role=writer
poc.wrapper.initial-connection.verify-opened-connection-type=writer

# [変数][調整] 接続を開くときのリトライの最大時間(ミリ秒)。停止した Reader が選ばれたとき、この時間だけ接続を試み続けてから、別の Reader に切り替わる。
#             短くすると、止まった Reader を早くあきらめる。フェイルオーバー中は、新しい接続が待たずにエラーになりやすくなる
poc.wrapper.initial-connection.open-connection-retry-timeout-ms=30000

# [変数][調整] 複数のクラスターに接続する場合に、クラスターごとに別の値にする識別子
poc.wrapper.cluster-id=poc

# [変数][調整] Reader が複数あるときの、Reader の選択方式 (readerHostSelectorStrategy)
#   random (既定) / roundRobin / leastConnections (内部プールが必須。なければ例外) / weightedRandom / lowestLoad など
poc.wrapper.reader-host-selector-strategy=random

# [変数][調整] フェイルオーバー (failover2)
poc.wrapper.failover.mode=strict-writer
poc.wrapper.failover.timeout-ms=60000
poc.wrapper.failover.topology-refresh-rate-ms=5000

# ============================================================
# ④ コネクションプールの本数 (wrapper の内部プール / HikariCP)
#    Writer / Reader のインスタンスごとに、それぞれこの設定でプールが作られる
# ============================================================
# [変数][必須] 内部プールを有効にする
poc.pool.type=hikari

# [変数][調整] 1インスタンスあたりの最大接続数
poc.pool.maximum-size=10
# [変数][調整] 1インスタンスあたりの最小アイドル接続数 (プール作成時に先に確保される)
poc.pool.minimum-idle=2
# [変数][調整] プールから接続を取得するときの待ち時間(ミリ秒)
poc.pool.connection-timeout-ms=5000

# [変数][調整] 接続の初期状態 (プールが作る Writer / Reader の接続に設定される)
#   auto-commit=false     : 自動コミットを無効にする。コミット / ロールバックは Spring の @Transactional が制御する。
#                           @Transactional の外で実行した更新は、コミットされない点に注意
#   transaction-isolation : トランザクション分離レベル。TRANSACTION_READ_COMMITTED = READ COMMITTED
#                           (PostgreSQL の既定と同じ。明示することで、既定が変わっても影響を受けない)
poc.pool.auto-commit=false
poc.pool.transaction-isolation=TRANSACTION_READ_COMMITTED

# [変数][調整] プールが作る接続を、読み取り専用にするか (HikariCP の既定値と同じ false)
#   読み書きの振り分けは、プールの設定ではなく @Transactional(readOnly = true) → setReadOnly で wrapper が行う。
#   注意: true にすると Writer の接続も読み取り専用になり、更新ができなくなる
poc.pool.read-only=false
