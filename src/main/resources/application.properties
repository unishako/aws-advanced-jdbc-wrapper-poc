spring.application.name=aws-advanced-jdbc-wrapper-poc
server.port=8080

# ============================================================
# AWS Advanced JDBC Wrapper のオプション (個別の設定項目。下の spring.datasource.url から参照される)
# ============================================================
# プラグイン: initialConnection → readWriteSplitting → failover2 → efm2 の順
#   initialConnection : クラスターエンドポイントをトポロジー上の Writer インスタンスに置き換える
#                       (クラスターエンドポイントへの接続は内部プールの対象外のため、Writer もプールされるようにする)
poc.wrapper.plugins=initialConnection,readWriteSplitting,failover2,efm2
poc.wrapper.dialect=aurora-pg
poc.wrapper.cluster-id=poc

# initialConnection プラグイン
poc.wrapper.initial-connection.endpoint-substitution-role=writer
poc.wrapper.initial-connection.verify-opened-connection-type=writer

# フェイルオーバー (failover2)
poc.wrapper.failover.mode=strict-writer
poc.wrapper.failover.timeout-ms=60000
poc.wrapper.failover.topology-refresh-rate-ms=5000

# ============================================================
# コネクションプールの本数 (wrapper の内部プール / HikariCP)
# Writer / Reader のインスタンスごとに、それぞれこの設定でプールが作られる
# ============================================================
poc.pool.type=hikari
# 1インスタンスあたりの最大接続数
poc.pool.maximum-size=10
# 1インスタンスあたりの最小アイドル接続数 (プール作成時に先に確保される)
poc.pool.minimum-idle=2
# プールから接続を取得するときの待ち時間(ミリ秒)
poc.pool.connection-timeout-ms=5000

# ============================================================
# DataSource (Spring Boot 標準。プールなし。プールは wrapper の内部プールが担当する)
# ============================================================
spring.datasource.type=org.springframework.jdbc.datasource.DriverManagerDataSource
spring.datasource.driver-class-name=software.amazon.jdbc.Driver
# Aurora のクラスターエンドポイント(Writer)。compose ネットワーク内の alias で名前解決される
spring.datasource.url=jdbc:aws-wrapper:postgresql://poc.cluster-abcdefghijkl.ap-northeast-1.rds.amazonaws.com:5432/${POSTGRES_DB:app}?wrapperPlugins=${poc.wrapper.plugins}&wrapperDialect=${poc.wrapper.dialect}&clusterId=${poc.wrapper.cluster-id}&endpointSubstitutionRole=${poc.wrapper.initial-connection.endpoint-substitution-role}&verifyOpenedConnectionType=${poc.wrapper.initial-connection.verify-opened-connection-type}&failoverMode=${poc.wrapper.failover.mode}&failoverTimeoutMs=${poc.wrapper.failover.timeout-ms}&clusterTopologyRefreshRateMs=${poc.wrapper.failover.topology-refresh-rate-ms}&connectionPoolType=${poc.pool.type}&cp-MaximumPoolSize=${poc.pool.maximum-size}&cp-MinimumIdle=${poc.pool.minimum-idle}&cp-ConnectionTimeout=${poc.pool.connection-timeout-ms}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

# URL が jdbc:aws-wrapper: のため、Doma の方言は自動判定せず明示する
doma.dialect=postgres

logging.level.com.example.poc=INFO
